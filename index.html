<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Un cofre de recuerdos: nuestras mejores fotos, videos y una canción dedicada." />
  <meta name="theme-color" content="#05130c" />
  <title>Cofre de Recuerdos</title>

  <!-- Tipografía: serif decorativa para títulos + sans limpia para la interfaz -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Mulish:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Textura de grano y viñeta para dar atmósfera -->
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ============================================================
       1. PANTALLA DE ACCESO — EL COFRE
       ============================================================ -->
  <div id="access-overlay" class="access-overlay">
    <!-- Luciérnagas doradas flotando de fondo -->
    <div class="fireflies" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span>
    </div>

    <header class="access-header">
      <p class="eyebrow">Solo para ti</p>
      <h1 class="access-title">Cofre de Recuerdos</h1>
      <p class="access-subtitle">Toca el cofre para abrirlo</p>
    </header>

    <!-- El cofre es un botón accesible (Enter/Espacio lo abren) -->
    <button id="chest-btn" class="chest" type="button" aria-label="Abrir el cofre de recuerdos">
      <span class="chest-glow" aria-hidden="true"></span>
      <svg class="chest-svg" viewBox="0 0 200 170" role="img" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e5a3c" />
            <stop offset="1" stop-color="#0c2e1d" />
          </linearGradient>
          <linearGradient id="woodLid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2c7a52" />
            <stop offset="1" stop-color="#134028" />
          </linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f5e2a3" />
            <stop offset="0.5" stop-color="#e6c979" />
            <stop offset="1" stop-color="#b28a3c" />
          </linearGradient>
          <radialGradient id="keyhole" cx="0.5" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#fff4cf" />
            <stop offset="1" stop-color="#8a6a2b" />
          </radialGradient>
        </defs>

        <!-- Cuerpo del cofre -->
        <rect x="24" y="78" width="152" height="72" rx="8" fill="url(#wood)" stroke="#083019" stroke-width="2" />
        <!-- Tapa curva -->
        <path d="M24 82 Q24 40 100 40 Q176 40 176 82 Z" fill="url(#woodLid)" stroke="#083019" stroke-width="2" />
        <!-- Bandas doradas verticales -->
        <rect x="52" y="44" width="9" height="106" fill="url(#gold)" opacity="0.92" />
        <rect x="139" y="44" width="9" height="106" fill="url(#gold)" opacity="0.92" />
        <!-- Banda dorada de la tapa -->
        <path d="M24 82 Q24 40 100 40 Q176 40 176 82" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.85" />
        <!-- Herraje frontal -->
        <rect x="24" y="78" width="152" height="9" fill="url(#gold)" opacity="0.9" />
        <!-- Cerradura -->
        <rect x="88" y="86" width="24" height="30" rx="5" fill="url(#gold)" stroke="#7a5c24" stroke-width="1.5" />
        <circle cx="100" cy="98" r="5" fill="url(#keyhole)" />
        <rect x="98.5" y="99" width="3" height="10" rx="1.5" fill="#5c4418" />
        <!-- Remaches -->
        <circle cx="34" cy="94" r="2.4" fill="#f0dca3" />
        <circle cx="166" cy="94" r="2.4" fill="#f0dca3" />
        <circle cx="34" cy="140" r="2.4" fill="#f0dca3" />
        <circle cx="166" cy="140" r="2.4" fill="#f0dca3" />
      </svg>
      <span class="chest-hint">Ábreme</span>
    </button>
  </div>

  <!-- ============================================================
       MODAL DE CONTRASEÑA
       ============================================================ -->
  <div id="access-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
      <button id="modal-close" class="modal-close" type="button" aria-label="Cerrar">&times;</button>

      <div class="modal-lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2.5" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          <circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none" />
        </svg>
      </div>

      <h2 id="modal-title" class="modal-title">Una llave para el cofre</h2>
      <p id="modal-desc" class="modal-desc">Escribe nuestra clave secreta</p>

      <form id="access-form" class="access-form" novalidate>
        <input
          id="password-input"
          class="password-input"
          type="password"
          inputmode="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Nuestra clave"
          aria-label="Contraseña"
          aria-describedby="error-msg"
        />
        <p id="error-msg" class="error-msg" role="alert" aria-live="assertive"></p>
        <button type="submit" class="btn-open">Abrir</button>
      </form>
    </div>
  </div>

  <!-- ============================================================
       2. CONTENIDO PRINCIPAL — GALERÍA (oculto hasta autenticarse)
       ============================================================ -->
  <main id="main-content" class="main-content" hidden>
    <header class="gallery-header">
      <p class="eyebrow eyebrow--light">Nuestros momentos</p>
      <h1 class="gallery-title">Cofre de Recuerdos</h1>
    </header>

    <section class="carousel" aria-roledescription="carrusel" aria-label="Galería de recuerdos">
      <div class="carousel-viewport">
        <ul id="carousel-track" class="carousel-track"></ul>
      </div>

      <button id="prev-btn" class="carousel-arrow carousel-arrow--prev" type="button" aria-label="Recuerdo anterior">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
      </button>
      <button id="next-btn" class="carousel-arrow carousel-arrow--next" type="button" aria-label="Siguiente recuerdo">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6" /></svg>
      </button>

      <div id="carousel-dots" class="carousel-dots" role="tablist" aria-label="Selección de recuerdo"></div>
    </section>
  </main>

  <!-- ============================================================
       3. REPRODUCTOR DE MÚSICA FLOTANTE (oculto hasta autenticarse)
       ============================================================ -->
  <div id="player" class="player" data-collapsed="true" hidden>
    <!-- Estado expandido -->
    <div class="player-card">
      <button id="player-collapse" class="player-collapse" type="button" aria-label="Minimizar reproductor">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12" /></svg>
      </button>

      <div class="player-info">
        <span class="player-disc" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
        </span>
        <div class="player-meta">
          <p class="player-title" id="song-title">Nuestra canción</p>
          <p class="player-artist" id="song-artist">Dedicada a ti</p>
        </div>
      </div>

      <div class="player-progress" id="progress-track" role="slider" tabindex="0" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="player-progress-fill" id="progress-fill"></div>
        <div class="player-progress-knob" id="progress-knob"></div>
      </div>

      <div class="player-times">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="player-controls">
        <button id="play-btn" class="player-play" type="button" aria-label="Reproducir">
          <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
        </button>
        <a id="download-btn" class="player-download" download aria-label="Descargar la canción">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12" /><polyline points="7 11 12 16 17 11" /><path d="M5 21h14" /></svg>
        </a>
      </div>
    </div>

    <!-- Estado colapsado: solo un botón circular -->
    <button id="player-fab" class="player-fab" type="button" aria-label="Abrir reproductor de música">
      <svg class="fab-note" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
    </button>

    <!-- Audio nativo controlado por JS (sin controles visibles del navegador) -->
    <audio id="audio" preload="metadata"></audio>
  </div>

  <script src="main.js"></script>
</body>
</html>
